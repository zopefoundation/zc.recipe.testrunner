# Generated with zope.meta (https://zopemeta.readthedocs.io/) from:
# https://github.com/zopefoundation/meta/tree/master/src/zope/meta/buildout-recipe
[tox]
minversion = 3.18
envlist =
    release-check
    lint
    py310
    py311
    py312
    py313
    py314
    pypy3
    coverage

[testenv]
usedevelop = true
deps =
    setuptools >= 78.1.1,< 81
commands =
    zope-testrunner --test-path=src {posargs:-vc}
extras =
    test

[testenv:buildout6]
# NOTE: manual addition, not generated by zope.meta -- re-add after
# regenerating this file.  Runs the unittest-based tests against
# zc.buildout 6 (PEP 660 editable develop eggs); the README doctests are
# excluded as their output is written against buildout 5.
basepython = python3
deps =
    setuptools >= 78.1.1,< 81
    zc.buildout == 6.0.0a1
    zc.recipe.egg == 6.0.0a1
commands =
    zope-testrunner --test-path=src {posargs:-vc} -t !README

[testenv:buildout6-setuptools84]
# NOTE: manual addition, not generated by zope.meta -- re-add after
# regenerating this file.  Like buildout6, but with setuptools 84 (the
# environment of issue #26) both in-process and as the build backend of
# the PEP 660 editable installs: PIP_NO_BUILD_ISOLATION=false disables
# pip's build isolation (sic, see
# https://pip.pypa.io/en/stable/topics/configuration/#environment-variables),
# otherwise pip would build the develop eggs with the latest setuptools.
basepython = python3
deps =
    setuptools == 84.0.0
    zc.buildout == 6.0.0a1
    zc.recipe.egg == 6.0.0a1
setenv =
    PIP_NO_BUILD_ISOLATION = false
commands =
    zope-testrunner --test-path=src {posargs:-vc} -t !README

[testenv:setuptools-latest]
basepython = python3
deps =
    git+https://github.com/pypa/setuptools.git\#egg=setuptools

[testenv:release-check]
description = ensure that the distribution is ready to release
basepython = python3
skip_install = true
deps =
    setuptools >= 78.1.1,< 81
    wheel
    twine
    build
    check-manifest
    check-python-versions >= 0.24.2
    wheel
commands_pre =
commands =
    check-manifest
    check-python-versions --only pyproject.toml,setup.py,tox.ini,.github/workflows/tests.yml
    python -m build --sdist --no-isolation
    twine check dist/*

[testenv:lint]
description = This env runs all linters configured in .pre-commit-config.yaml
basepython = python3
skip_install = true
deps =
    pre-commit
commands_pre =
commands =
    pre-commit run --all-files --show-diff-on-failure

[testenv:coverage]
basepython = python3
allowlist_externals =
    mkdir
setenv =
    COVERAGE_PROCESS_START={toxinidir}/pyproject.toml
deps =
    setuptools >= 78.1.1,< 81
    coverage[toml]
commands =
    mkdir -p {toxinidir}/parts/htmlcov
    coverage erase
    coverage run -m zope.testrunner --test-path=src {posargs:-vc}
    coverage combine
    coverage report
    coverage html
